<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Girişi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white max-w-md w-full p-8 rounded-2xl shadow-lg border">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Yönetici Girişi</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-4 p-3 rounded bg-red-100 text-red-700 text-sm border border-red-200">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Kullanıcı Adı</label>
                <input type="text" name="username" required class="w-full border p-3 rounded-lg outline-none focus:ring-2 focus:ring-rose-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Şifre</label>
                <input type="password" name="password" required class="w-full border p-3 rounded-lg outline-none focus:ring-2 focus:ring-rose-500">
            </div>
            <button type="submit" class="w-full bg-rose-600 text-white py-3 rounded-lg font-bold hover:bg-rose-700 transition">
                Giriş Yap
            </button>
        </form>
    </div>
</body>
</html>
